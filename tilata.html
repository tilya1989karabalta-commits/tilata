    </button>

    <button class="header-btn create-top"

      + Түзүү
    </button>

  </div>

</header>


<!-- ================= HOME ================= -->

<section id="home" class="step active">

  <div class="hero">

    </div>

    <div class="title-row">

    </div>


    <div

    </div>

  </div>

</section>

    </button>

        Кимдердин атынан

        placeholder="Мисалы: Эмирлан & Айгерим">


      <label>
        Дата жана убакыт

      </button>

    </div>

  </div>

</section>

<section id="result" class="step">

</div>


<footer>

/* =========================================

   ========================================= */

function renderCategories(){

  const box =
    document.getElementById("categories");

  const cats = [
    "Баары",
    ...new Set(
      templates.map(t => t.cat)
    )
  ];

  box.innerHTML = cats.map(cat => `

    <button
      class="category ${cat === selectedCategory ? "active":""}"
      onclick="selectCategory('${cat.replace(/'/g,"\\'")}')">

      ${cat}

    </button>

  `).join("");

}


function selectCategory(cat){

  selectedCategory = cat;

  renderCategories();

  renderTemplates();

}


/* =========================================
   TEMPLATES
   ========================================= */

function renderTemplates(){

  const box =
    document.getElementById("templates");

  const search =
    document.getElementById("search").value
      .toLowerCase()
      .trim();


  const list =
    templates.filter(t => {

      const categoryOK =
        selectedCategory === "Баары" ||
        t.cat === selectedCategory;

      const searchOK =
        !search ||
        t.title.toLowerCase().includes(search) ||
        t.cat.toLowerCase().includes(search);

      return categoryOK && searchOK;

    });


  document.getElementById("count").textContent =
    list.length + " шаблон";


  if(!list.length){

    box.innerHTML = `
      <div style="
        text-align:center;
        padding:40px;
        color:#aaa">
        Шаблон табылган жок.
      </div>
    `;

    return;

  }


  box.innerHTML =
    list.map(t => `

      <div class="card">

        <div class="card-image ${t.className}">

          <div class="badge">
            ${t.price} сом
          </div>

          <div class="card-center">

            <div class="card-icon">
              ${t.icon}
            </div>

            <div class="card-name">
              ${t.title}
            </div>

            <div class="card-type">
              ${t.type}
            </div>

          </div>

        </div>


        <div class="card-body">

          <h3>
            ${t.title}
          </h3>

          <p>
            ${t.desc}
          </p>


          <div class="price">

            <strong>
              ${t.price} сом
            </strong>

            <span style="font-size:11px;color:#00a651">
              Бир жолку төлөм
            </span>

          </div>


          <button
            class="select-btn"
            onclick="openTemplate(${t.id})">

            👁️ Көрүү жана тандоо

        </div>

function sendRsvp(status){

      .value.trim();


  if(!name){

    showToast(
      "Атыңызды жазыңыз"
    );

    return;

  }


  const rsvps =
    JSON.parse(
      localStorage.getItem("tilataRSVP") ||
      "[]"
    );


  rsvps.push({

    name:name,

    status:status,

    date:new Date().toISOString()

  });


  localStorage.setItem(
    "tilataRSVP",
    JSON.stringify(rsvps)
  );


  document.getElementById(
    "rsvpMessage"
  ).innerHTML = `

    <div style="
      background:#0c2819;

      border-radius:10px;
      color:#00d66b">

      <strong>${status}</strong>

}

/* =========================================
   COPY PAYMENT
   ========================================= */

function copyPayment(){

  const number =
    "0556652652";

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard.writeText(number)
      .then(() => {

        showToast(
          "✅ 0556-652-652 көчүрүлдү"
        );

      });

  }else{

    const area =
      document.createElement("textarea");

    area.value = number;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

    showToast(
      "✅ Номер көчүрүлдү"
    );

  }

}


/* =========================================
   SHARE
   ========================================= */

async function shareInvitation(){

  const url =
    window.location.href;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:"TILATA INVITE",

        text:"Менин чакыруум",

        url:url

      });

    }catch(e){}

  }else{

    copyText(url);

    showToast(
      "✅ Шилтеме көчүрүлдү"
    );

  }

}


/* =========================================
   COPY
   ========================================= */

function copyText(text){

  if(
    navigator.clipboard
  ){

    navigator.clipboard.writeText(text);

  }else{

    const area =
      document.createElement("textarea");

    area.value=text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

  }

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   TOAST
   ========================================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },2500);

}

        "tilataInvitation"
      );

    if(saved){

      invitationData =
        JSON.parse(saved);

    }

  }catch(e){

    console.log(e);

  }

}
